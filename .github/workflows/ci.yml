name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check backend JavaScript syntax
        run: |
          find services -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Validate frontend build
        working-directory: web
        run: npm run build

  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - files-service
          - upload-service
          - thumbnail-worker
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test --silent

  build-scan-push:
    name: Build and Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: services/gateway

          - service: auth-service
            context: services/auth-service

          - service: files-service
            context: services/files-service

          - service: upload-service
            context: services/upload-service

          - service: thumbnail-worker
            context: services/thumbnail-worker

          - service: notification-service
            context: services/notification-service

          - service: web
            context: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/cloudvault-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE" \
            "${{ matrix.context }}"

      - name: Scan application dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          pkg-types: library
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"